name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jaz006
          outputs: |
            dist/github-snake.svg?color_snake=ff1493&color_dots=fff0f5,ffb6c1,ff69b4,ff1493,c71585
            dist/github-snake-dark.svg?palette=github-dark&color_snake=ff69b4&color_dots=2d1b2e,f4c2c2,ffb6c1,ff69b4,c71585

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
